<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 720" role="img" aria-labelledby="title description">
  <title id="title">WASA Chat 全体構成（通常の利用）</title>
  <desc id="description">ブラウザはCloudflare Pagesから画面を受け取り、質問はCloud RunのGo APIへ送る。Cloud Runはログインの中継、利用回数の確保、目次からのページ選択、節の絞り込み、回答生成の順に処理し、WASA Wiki、Firestore、Gemini API、Cloud Storageを利用する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3c4043" />
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 26px; font-weight: 700; }
      .sub { font-size: 13px; fill: #666; }
      .group { font-size: 13px; font-weight: 700; fill: #444; }
      .node { font-size: 15px; font-weight: 700; }
      .detail { font-size: 11.5px; fill: #555; }
      .step-title { font-size: 13px; font-weight: 700; }
      .step-detail { font-size: 11px; fill: #555; }
      .edge-label { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #999; stroke-width: 1.4; }
      .primary { fill: #fbfcfd; stroke: #333; stroke-width: 2; }
      .step { fill: #f7f8fa; stroke: #dcdfe3; stroke-width: 1; }
      .memo { fill: none; stroke: #b9bec4; stroke-width: 1; stroke-dasharray: 5 4; }
      .edge { fill: none; stroke: #3c4043; stroke-width: 1.5; marker-end: url(#arrow); }
      .brace { fill: none; stroke: #b9bec4; stroke-width: 1.2; }
      .ic { fill: none; stroke: #3c4043; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .ic-f { fill: #3c4043; stroke: none; }
      .ic-t { fill: #eef1f5; stroke: #3c4043; stroke-width: 1.5; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1140" height="720" fill="#fff" />
  <text class="title" x="30" y="46">WASA Chat 全体構成（通常の利用）</text>
  <text class="sub" x="30" y="72">1回の質問が、どのサービスをどう通るかだけを示します。認証とRAGの詳細は 02・03 の図にあります。</text>

  <!-- ブラウザ -->
  <rect class="box" x="30" y="280" width="190" height="170" rx="14" />
  <g transform="translate(48,296) scale(1.25)">
    <rect class="ic" x="2.5" y="4" width="19" height="16" rx="2.2" />
    <path class="ic" d="M2.5 8.6H21.5" />
    <circle class="ic-f" cx="5.2" cy="6.3" r="0.75" />
    <circle class="ic-f" cx="7.6" cy="6.3" r="0.75" />
    <circle class="ic-f" cx="10" cy="6.3" r="0.75" />
  </g>
  <text class="node" x="88" y="317">部員のブラウザ</text>
  <text class="detail" x="48" y="356">Wikiの利用者名でログイン</text>
  <text class="detail" x="48" y="378">質問文と画像（長辺768pxへ縮小）</text>
  <text class="detail" x="48" y="400">回答はSSEで少しずつ表示</text>
  <text class="detail" x="48" y="422">履歴・共有アシスタントを選ぶ</text>

  <!-- Cloudflare Pages -->
  <rect class="box" x="330" y="118" width="430" height="104" rx="14" />
  <g transform="translate(348,140) scale(1.25)">
    <path class="ic" d="M7.2 18.5h10.3a3.6 3.6 0 0 0 .5-7.15A5.6 5.6 0 0 0 7.9 9.9 4.3 4.3 0 0 0 7.2 18.5z" />
  </g>
  <text class="node" x="390" y="160">Cloudflare Pages（フロントエンド）</text>
  <text class="detail" x="348" y="186">React + TypeScript（Vite）をビルドした静的ファイルだけを配信します</text>
  <text class="detail" x="348" y="207">サーバー処理は持ちません。データは全てCloud RunのAPIへ問い合わせます</text>

  <!-- 補足メモ -->
  <rect class="memo" x="800" y="118" width="310" height="104" rx="12" />
  <text class="detail" x="818" y="145">1回の質問でLLMを3回呼びます（③④⑤）。</text>
  <text class="detail" x="818" y="167">目次は毎回同じ内容を先頭へ固定し、</text>
  <text class="detail" x="818" y="189">プロンプトキャッシュを効かせています。</text>
  <text class="detail" x="818" y="211">利用者ごとの上限は1日30質問です。</text>

  <!-- Cloud Run -->
  <rect class="primary" x="330" y="250" width="430" height="380" rx="16" />
  <g transform="translate(346,266) scale(1.25)">
    <path class="ic" d="M12 2.8 20.8 7.4v9.2L12 21.2 3.2 16.6V7.4z" />
    <path class="ic" d="M3.2 7.4 12 12l8.8-4.6" />
    <path class="ic" d="M12 12v9.2" />
  </g>
  <text class="node" x="388" y="282" font-size="16">Cloud Run（バックエンド / Go）</text>
  <text class="detail" x="388" y="303">コンテナ1つ。min-instances=0（待機中は課金なし）</text>
  <line x1="346" y1="314" x2="744" y2="314" stroke="#e2e5e9" />

  <!-- ① ログイン -->
  <rect class="step" x="346" y="322" width="398" height="48" rx="9" />
  <g transform="translate(358,337) scale(0.75)">
    <rect class="ic" x="4.8" y="10.5" width="14.4" height="9.5" rx="2" />
    <path class="ic" d="M8.4 10.5V7.8a3.6 3.6 0 0 1 7.2 0v2.7" />
  </g>
  <text class="step-title" x="386" y="342">① ログインを中継し、本人を確かめる</text>
  <text class="step-detail" x="386" y="360">パスワードは保存せずWikiへ中継。以後は署名付きCookieで判定</text>

  <!-- ② 利用回数 -->
  <rect class="step" x="346" y="376" width="398" height="48" rx="9" />
  <g transform="translate(358,391) scale(0.75)">
    <path class="ic" d="M4.2 17.5a7.8 7.8 0 1 1 15.6 0" />
    <path class="ic" d="M12 13.6l4.2-4.4" />
    <circle class="ic-f" cx="12" cy="17.5" r="1" />
  </g>
  <text class="step-title" x="386" y="396">② 利用回数を先に確保する</text>
  <text class="step-detail" x="386" y="414">Firestoreのトランザクションで1日30質問を先に押さえる</text>

  <!-- ③ ページ選択 -->
  <rect class="step" x="346" y="430" width="398" height="48" rx="9" />
  <g transform="translate(358,445) scale(0.75)">
    <path class="ic" d="M9 6.5h10.5M9 12h10.5M9 17.5h10.5" />
    <circle class="ic-f" cx="5" cy="6.5" r="1" />
    <circle class="ic-f" cx="5" cy="12" r="1" />
    <circle class="ic-f" cx="5" cy="17.5" r="1" />
  </g>
  <text class="step-title" x="386" y="450">③ 目次から関連ページを選ぶ</text>
  <text class="step-detail" x="386" y="468">目次（約3.5万字）をLLMへ。実在するページ名だけ採用し最大4ページ</text>

  <!-- ④ 節の絞り込み -->
  <rect class="step" x="346" y="484" width="398" height="48" rx="9" />
  <g transform="translate(358,499) scale(0.75)">
    <path class="ic" d="M4.5 5h15l-6.2 7.3v5.9l-2.6-1.9v-4z" />
  </g>
  <text class="step-title" x="386" y="504">④ 読む節（チャンク）まで絞る</text>
  <text class="step-detail" x="386" y="522">本文が12,000字以下ならページごと渡し、超えるときだけ最大8節へ絞る</text>

  <!-- ⑤ 回答生成 -->
  <rect class="step" x="346" y="538" width="398" height="48" rx="9" />
  <g transform="translate(358,553) scale(0.75)">
    <path class="ic" d="M4.5 6h15v9.5h-8.6L6.6 19.4v-3.9H4.5z" />
  </g>
  <text class="step-title" x="386" y="558">⑤ 回答を作り、書けた分から送り返す</text>
  <text class="step-detail" x="386" y="576">出典は索引から組み立て、モデルは番号だけを書く。差分をSSEで送る</text>

  <rect class="memo" x="346" y="594" width="398" height="28" rx="8" />
  <text class="step-detail" x="360" y="612">索引は起動時にメモリへ読み込み済み。質問のたびにWiki本文は取りに行かない</text>

  <!-- 右列 -->
  <text class="group" x="800" y="292">Cloud Run が呼び出す先</text>

  <rect class="box" x="800" y="304" width="310" height="84" rx="14" />
  <g transform="translate(818,320) scale(1.083)">
    <path class="ic" d="M12 6.6C10.4 5.1 7.9 4.6 4.8 4.9v12.5c3.1-.3 5.6.2 7.2 1.7 1.6-1.5 4.1-2 7.2-1.7V4.9c-3.1-.3-5.6.2-7.2 1.7z" />
    <path class="ic" d="M12 6.6v12.5" />
  </g>
  <text class="node" x="856" y="333">WASA Wiki（MediaWiki）</text>
  <text class="detail" x="818" y="357">ログインの中継先（action=clientlogin）</text>
  <text class="detail" x="818" y="376">回答用の本文はここから直接取らない</text>

  <rect class="box" x="800" y="396" width="310" height="84" rx="14" />
  <g transform="translate(818,412) scale(1.083)">
    <ellipse class="ic" cx="12" cy="6.2" rx="7.4" ry="3.2" />
    <path class="ic" d="M4.6 6.2v11.6c0 1.8 3.3 3.2 7.4 3.2s7.4-1.4 7.4-3.2V6.2" />
    <path class="ic" d="M4.6 12c0 1.8 3.3 3.2 7.4 3.2s7.4-1.4 7.4-3.2" />
  </g>
  <text class="node" x="856" y="425">Firestore</text>
  <text class="detail" x="818" y="449">利用回数 / 履歴（最大30件）/ 利用者情報</text>
  <text class="detail" x="818" y="468">共有アシスタント / 評価 / 監査ログ</text>

  <rect class="box" x="800" y="488" width="310" height="84" rx="14" />
  <g transform="translate(818,504) scale(1.083)">
    <path class="ic-t" d="M12 2.4c.85 4.9 3.85 7.9 8.75 8.75-4.9.85-7.9 3.85-8.75 8.75-.85-4.9-3.85-7.9-8.75-8.75 4.9-.85 7.9-3.85 8.75-8.75z" />
  </g>
  <text class="node" x="856" y="517">Gemini API</text>
  <text class="detail" x="818" y="541">gemini-3.5-flash-lite（回答モードで変える）</text>
  <text class="detail" x="818" y="560">③④⑤で1質問あたり3回。実回数は管理画面で集計</text>

  <rect class="box" x="800" y="580" width="310" height="84" rx="14" />
  <g transform="translate(818,596) scale(1.083)">
    <path class="ic" d="M3.6 4.6h16.8v3.2H3.6z" />
    <path class="ic" d="M5.2 7.8h13.6l-1.5 11.3a2.1 2.1 0 0 1-2.1 1.8H8.8a2.1 2.1 0 0 1-2.1-1.8z" />
  </g>
  <text class="node" x="856" y="609">Cloud Storage（非公開）</text>
  <text class="detail" x="818" y="633">索引 index.json と目次 toc.md（646ページ）</text>
  <text class="detail" x="818" y="652">起動時にメモリへ読み込む（1,012チャンク）</text>

  <!-- 経路 -->
  <path class="edge" d="M 220 330 H 254 V 170 H 330" />
  <text class="edge-label" x="260" y="300">① 画面を受け取る</text>
  <path class="edge" d="M 220 375 H 330" />
  <text class="edge-label" x="275" y="367" text-anchor="middle">② 質問を送る</text>
  <path class="edge" d="M 330 415 H 220" />
  <text class="edge-label" x="275" y="407" text-anchor="middle">③ SSEで受け取る</text>

  <path class="edge" d="M 760 346 H 780 V 346 H 800" />
  <path class="edge" d="M 760 400 H 780 V 438 H 800" />
  <path class="brace" d="M 750 440 H 756 V 578 H 750" />
  <path class="edge" d="M 756 509 H 780 V 530 H 800" />
  <path class="edge" d="M 800 622 H 782 V 608 H 760" />

  <text class="sub" x="30" y="694">資料の更新（rebuild.py → Cloud Storageの索引差し替え）と管理画面は、この図の対象外です。手順は 07-デプロイと更新 にあります。</text>
</svg>
